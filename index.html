<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: black;
  font-family: Arial, sans-serif;
}

#screen {
  width: 100vw;
  height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
  color: white;
  background: black;
}

.title {
  font-size: 64px;
}

.subtitle {
  font-size: 30px;
  margin-top: 25px;
}

.ad-image,
.ad-video {
  width: 100vw;
  height: 100vh;
  object-fit: contain;
  background: black;
  display: block;
}
</style>
</head>

<body>

<div id="screen"></div>

<script>

let playlist = [];
let current = 0;
let slideTimer = null;

async function loadPlaylist() {
  try {
    const response = await fetch("playlist.json?t=" + Date.now());

    if (!response.ok) {
      throw new Error("Playlist HTTP error: " + response.status);
    }

    playlist = await response.json();

    console.log("Playlist loaded:", playlist);

  } catch (error) {

    console.error("Playlist load failed:", error);

    document.getElementById("screen").innerHTML =
      "<div><div class='title'>PLAYLIST ERROR</div><div class='subtitle'>" +
      error +
      "</div></div>";
  }
}

function nextSlide() {

  if (!playlist.length) {
    return;
  }

  current = (current + 1) % playlist.length;

  showSlide();
}

function showSlide() {

  if (!playlist.length) {
    return;
  }

  if (slideTimer) {
    clearTimeout(slideTimer);
    slideTimer = null;
  }

  const item = playlist[current];
  const screen = document.getElementById("screen");

  console.log("Showing item:", item);

  screen.innerHTML = "";

  if (item.type === "image") {

    const img = document.createElement("img");

    img.className = "ad-image";

    img.src =
      item.url +
      "?t=" +
      Date.now();

    screen.appendChild(img);

    const duration = item.duration || 10000;

    slideTimer = setTimeout(nextSlide, duration);

  }

  else if (item.type === "video") {

    const video = document.createElement("video");

    video.className = "ad-video";

    video.src =
      item.url +
      "?t=" +
      Date.now();

    video.autoplay = true;
    video.muted = true;
    video.playsInline = true;
    video.preload = "auto";

    screen.appendChild(video);

    video.addEventListener("ended", () => {
      nextSlide();
    });

    video.addEventListener("error", () => {
      console.error("Video failed:", item.url);
      slideTimer = setTimeout(nextSlide, 3000);
    });

    if (item.duration) {

      slideTimer = setTimeout(() => {

        video.pause();

        nextSlide();

      }, item.duration);
    }

  }

  else {

    screen.innerHTML =
      "<div>" +
      "<div class='title'>" + (item.title || "") + "</div>" +
      "<div class='subtitle'>" + (item.subtitle || "") + "</div>" +
      "</div>";

    const duration = item.duration || 8000;

    slideTimer = setTimeout(nextSlide, duration);
  }
}

async function start() {

  await loadPlaylist();

  showSlide();

  setInterval(async () => {

    await loadPlaylist();

  }, 60000);
}

start();

</script>

</body>
</html>
