<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: black;
  font-family: Arial, sans-serif;
}

#screen {
  width: 100vw;
  height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
  color: white;
  background: black;
}

.title {
  font-size: 64px;
}

.subtitle {
  font-size: 30px;
  margin-top: 25px;
}

.ad-image {
  width: 100vw;
  height: 100vh;
  object-fit: contain;
  background: black;
}
</style>
</head>

<body>

<div id="screen"></div>

<script>

let playlist = [];
let current = 0;

async function loadPlaylist() {
  try {
    const response = await fetch("playlist.json?t=" + Date.now());
    playlist = await response.json();
    console.log("Playlist loaded:", playlist);
  } catch (error) {
    document.getElementById("screen").innerHTML =
      "<div><div class='title'>PLAYLIST ERROR</div><div class='subtitle'>" +
      error +
      "</div></div>";
  }
}

function showSlide() {

  if (!playlist.length) {
    return;
  }

  const item = playlist[current];
  const screen = document.getElementById("screen");

  console.log("Showing item:", item);

  if (item.type === "image") {

    screen.innerHTML =
      "<img class='ad-image' src='" +
      item.url +
      "?t=" +
      Date.now() +
      "'>";

  } else {

    screen.innerHTML =
      "<div>" +
      "<div class='title'>" + (item.title || "") + "</div>" +
      "<div class='subtitle'>" + (item.subtitle || "") + "</div>" +
      "</div>";

  }

  const duration = item.duration || 8000;

  current = (current + 1) % playlist.length;

  setTimeout(showSlide, duration);
}

async function start() {
  await loadPlaylist();
  showSlide();

  setInterval(async () => {
    await loadPlaylist();
  }, 60000);
}

start();

</script>

</body>
</html>
