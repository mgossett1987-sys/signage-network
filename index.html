<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">

<style>
html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: black;
  font-family: Arial, sans-serif;
}

#screen {
  width: 100vw;
  height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
  color: white;
  background: black;
}

.title {
  font-size: 64px;
}

.subtitle {
  font-size: 30px;
  margin-top: 25px;
}

.ad-image,
.ad-video {
  width: 100vw;
  height: 100vh;
  object-fit: contain;
  background: black;
  display: block;
}

/* WEATHER */

.weather-card {
  width: 100vw;
  height: 100vh;
  box-sizing: border-box;
  padding: 55px 70px;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  position: relative;
  overflow: hidden;
  background:
    radial-gradient(circle at 15% 20%, rgba(255,255,255,0.88) 0%, rgba(255,255,255,0) 23%),
    radial-gradient(circle at 85% 78%, rgba(255,255,255,0.68) 0%, rgba(255,255,255,0) 25%),
    linear-gradient(145deg, #dff6fb 0%, #bfeaf4 45%, #8fd4e5 100%);
  color: #173f4f;
}

.weather-brand {
  font-size: 34px;
  font-weight: 700;
  letter-spacing: 2px;
  color: #174b5c;
  margin-bottom: 6px;
}

.weather-tagline {
  font-size: 20px;
  letter-spacing: 3px;
  text-transform: uppercase;
  color: #e66f47;
  margin-bottom: 32px;
}

.weather-location {
  font-size: 32px;
  font-weight: 700;
  color: #24596a;
  margin-bottom: 8px;
}

.weather-label {
  font-size: 22px;
  letter-spacing: 3px;
  color: #477887;
  margin-bottom: 12px;
}

.weather-temp {
  font-size: 118px;
  font-weight: 700;
  line-height: 1;
  color: #153f50;
}

.weather-condition {
  font-size: 38px;
  font-weight: 600;
  color: #e66f47;
  margin-bottom: 12px;
}

.weather-feels {
  font-size: 24px;
  color: #477887;
  margin-bottom: 30px;
}

.weather-stats {
  display: flex;
  gap: 25px;
}

.weather-stat {
  min-width: 150px;
  padding: 18px 25px;
  border-radius: 22px;
  background: rgba(255,255,255,0.72);
  font-size: 24px;
  font-weight: 700;
  color: #174b5c;
}

.weather-butterfly {
  position: absolute;
  opacity: 0.95;
}

.weather-butterfly-one {
  width: 95px;
  top: 35px;
  right: 55px;
  transform: rotate(12deg);
}

.weather-butterfly-two {
  width: 70px;
  bottom: 40px;
  left: 55px;
  transform: rotate(-18deg);
}

.weather-footer {
  margin-top: 32px;
  font-size: 20px;
  letter-spacing: 2px;
  color: #477887;
}

/* EVENTS */

.events-card {
  width: 100vw;
  height: 100vh;
  box-sizing: border-box;
  padding: 45px 70px;
  background:
    radial-gradient(circle at 10% 15%, rgba(255,255,255,0.85), transparent 22%),
    linear-gradient(145deg, #dff6fb 0%, #bfeaf4 50%, #8fd4e5 100%);
  color: #173f4f;
  position: relative;
  overflow: hidden;
}

.events-brand {
  font-size: 26px;
  font-weight: 700;
  letter-spacing: 2px;
  color: #174b5c;
}

.events-title {
  font-size: 48px;
  font-weight: 700;
  margin: 8px 0 25px 0;
  color: #e66f47;
}

.events-list {
  display: flex;
  flex-direction: column;
  gap: 16px;
  width: 86%;
  margin: 0 auto;
}

.event-item {
  background: rgba(255,255,255,0.78);
  border-radius: 18px;
  padding: 15px 22px;
  text-align: left;
  box-shadow: 0 5px 18px rgba(23,75,92,0.08);
}

.event-title {
  font-size: 26px;
  font-weight: 700;
  color: #174b5c;
}

.event-details {
  font-size: 20px;
  color: #477887;
  margin-top: 5px;
}

.events-footer {
  margin-top: 22px;
  font-size: 18px;
  letter-spacing: 1px;
  color: #477887;
}

.events-butterfly {
  position: absolute;
  width: 80px;
  top: 35px;
  right: 45px;
}
</style>
</head>

<body>

<div id="screen"></div>

<script>

let playlist = [];
let current = 0;
let slideTimer = null;
let advancing = false;
let playlistSignature = "";

const PLAYLIST_URL =
  "https://raw.githubusercontent.com/mgossett1987-sys/signage-network/main/playlist.json";

const EVENTS_URL =
  "https://raw.githubusercontent.com/mgossett1987-sys/signage-network/main/events.json";

async function loadPlaylist(firstLoad = false) {
  try {
    const response = await fetch(
      PLAYLIST_URL + "?nocache=" + Date.now(),
      { cache: "no-store" }
    );

    const newPlaylist = await response.json();

    if (!Array.isArray(newPlaylist) || !newPlaylist.length) {
      throw new Error("Playlist invalid");
    }

    const newSignature = JSON.stringify(newPlaylist);

    if (firstLoad || newSignature !== playlistSignature) {
      playlist = newPlaylist;
      playlistSignature = newSignature;

      if (!firstLoad) {
        current = 0;

        if (slideTimer) {
          clearTimeout(slideTimer);
        }

        showSlide();
      }
    }

  } catch (error) {
    console.error("Playlist error:", error);
  }
}

function nextSlide() {
  if (!playlist.length || advancing) return;

  advancing = true;

  if (slideTimer) clearTimeout(slideTimer);

  current = (current + 1) % playlist.length;

  setTimeout(() => {
    advancing = false;
    showSlide();
  }, 100);
}

function weatherCodeToText(code) {
  const map = {
    0: "Clear",
    1: "Mostly Clear",
    2: "Partly Cloudy",
    3: "Cloudy",
    45: "Foggy",
    51: "Light Drizzle",
    61: "Light Rain",
    63: "Rain",
    65: "Heavy Rain",
    71: "Light Snow",
    73: "Snow",
    80: "Rain Showers",
    81: "Rain Showers",
    82: "Heavy Showers",
    95: "Thunderstorms"
  };

  return map[code] || "Current Conditions";
}

async function showWeather(item) {
  const screen = document.getElementById("screen");

  try {
    const url =
      "https://api.open-meteo.com/v1/forecast" +
      "?latitude=" + item.latitude +
      "&longitude=" + item.longitude +
      "&current=temperature_2m,apparent_temperature,weather_code" +
      "&daily=temperature_2m_max,temperature_2m_min,precipitation_probability_max" +
      "&temperature_unit=fahrenheit&timezone=auto";

    const response = await fetch(url, { cache: "no-store" });
    const data = await response.json();

    const temp = Math.round(data.current.temperature_2m);
    const feels = Math.round(data.current.apparent_temperature);
    const high = Math.round(data.daily.temperature_2m_max[0]);
    const low = Math.round(data.daily.temperature_2m_min[0]);
    const rain = Math.round(data.daily.precipitation_probability_max[0]);

    screen.innerHTML =
      "<div class='weather-card'>" +

      "<img class='weather-butterfly weather-butterfly-one' src='ads/butterfly.png'>" +
      "<img class='weather-butterfly weather-butterfly-two' src='ads/butterfly.png'>" +

      "<div class='weather-brand'>EXTRA CARE HAIR CO.</div>" +
      "<div class='weather-tagline'>A SALON FOR EVERYONE</div>" +
      "<div class='weather-location'>" + item.location + "</div>" +
      "<div class='weather-label'>TODAY'S WEATHER</div>" +
      "<div class='weather-temp'>" + temp + "°F</div>" +
      "<div class='weather-condition'>" +
      weatherCodeToText(data.current.weather_code) +
      "</div>" +
      "<div class='weather-feels'>Feels like " + feels + "°F</div>" +

      "<div class='weather-stats'>" +
      "<div class='weather-stat'>HIGH " + high + "°</div>" +
      "<div class='weather-stat'>LOW " + low + "°</div>" +
      "<div class='weather-stat'>RAIN " + rain + "%</div>" +
      "</div>" +

      "<div class='weather-footer'>RELAX • REFRESH • FEEL LIKE YOU</div>" +

      "</div>";

  } catch (error) {
    console.error("Weather error:", error);
    screen.innerHTML = "<div class='weather-card'>Weather unavailable</div>";
  }

  slideTimer = setTimeout(nextSlide, item.duration || 12000);
}

async function showEvents(item) {
  const screen = document.getElementById("screen");

  try {
    const response = await fetch(
      EVENTS_URL + "?nocache=" + Date.now(),
      { cache: "no-store" }
    );

    if (!response.ok) {
      throw new Error("Events HTTP error");
    }

    const data = await response.json();

    const events = (data.events || []).slice(0, 4);

    let eventHtml = "";

    events.forEach(event => {
      eventHtml +=
        "<div class='event-item'>" +
        "<div class='event-title'>" +
        event.title +
        "</div>" +
        "<div class='event-details'>" +
        event.date +
        " • " +
        event.time +
        " • " +
        event.location +
        "</div>" +
        "</div>";
    });

    screen.innerHTML =
      "<div class='events-card'>" +

      "<img class='events-butterfly' src='ads/butterfly.png'>" +

      "<div class='events-brand'>EXTRA CARE HAIR CO.</div>" +
      "<div class='events-title'>" +
      (data.title || "Family Fun Around 417-Land") +
      "</div>" +

      "<div class='events-list'>" +
      eventHtml +
      "</div>" +

      "<div class='events-footer'>" +
      "UPCOMING FAMILY-FRIENDLY EVENTS" +
      "</div>" +

      "</div>";

  } catch (error) {
    console.error("Events error:", error);

    screen.innerHTML =
      "<div class='events-card'>" +
      "<div class='events-title'>Local Events</div>" +
      "<div class='event-details'>Events temporarily unavailable</div>" +
      "</div>";
  }

  slideTimer = setTimeout(nextSlide, item.duration || 15000);
}

function showSlide() {
  if (!playlist.length) return;

  if (slideTimer) clearTimeout(slideTimer);

  const item = playlist[current];
  const screen = document.getElementById("screen");

  screen.innerHTML = "";

  if (item.type === "image") {
    const img = document.createElement("img");

    img.className = "ad-image";
    img.src = item.url + "?nocache=" + Date.now();

    img.onerror = () => {
      slideTimer = setTimeout(nextSlide, 1500);
    };

    screen.appendChild(img);

    slideTimer =
      setTimeout(nextSlide, item.duration || 10000);
  }

  else if (item.type === "video") {
    const video = document.createElement("video");

    video.className = "ad-video";
    video.src = item.url + "?nocache=" + Date.now();
    video.autoplay = true;
    video.muted = true;
    video.playsInline = true;

    video.onended = nextSlide;
    video.onerror = () => {
      slideTimer = setTimeout(nextSlide, 1500);
    };

    screen.appendChild(video);

    video.play().catch(() => {
      slideTimer = setTimeout(nextSlide, 1500);
    });

    if (item.duration) {
      slideTimer = setTimeout(nextSlide, item.duration);
    }
  }

  else if (item.type === "weather") {
    showWeather(item);
  }

  else if (item.type === "events") {
    showEvents(item);
  }

  else if (item.type === "text") {
    screen.innerHTML =
      "<div>" +
      "<div class='title'>" + (item.title || "") + "</div>" +
      "<div class='subtitle'>" + (item.subtitle || "") + "</div>" +
      "</div>";

    slideTimer =
      setTimeout(nextSlide, item.duration || 8000);
  }

  else {
    slideTimer = setTimeout(nextSlide, 1500);
  }
}

async function start() {
  await loadPlaylist(true);
  showSlide();

  setInterval(async () => {
    await loadPlaylist(false);
  }, 15000);
}

start();

</script>

</body>
</html>
