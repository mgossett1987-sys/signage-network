<script>

let playlist = [];
let current = 0;
let slideTimer = null;
let advancing = false;

async function loadPlaylist() {
  try {
    const response = await fetch("playlist.json?t=" + Date.now());

    if (!response.ok) {
      throw new Error("Playlist HTTP error: " + response.status);
    }

    const newPlaylist = await response.json();

    if (Array.isArray(newPlaylist) && newPlaylist.length) {
      playlist = newPlaylist;
      console.log("Playlist loaded:", playlist);
    }

  } catch (error) {
    console.error("Playlist load failed:", error);

    // Keep the last good playlist running if one already exists.
    if (!playlist.length) {
      document.getElementById("screen").innerHTML =
        "<div><div class='title'>PLAYLIST ERROR</div><div class='subtitle'>" +
        error +
        "</div></div>";
    }
  }
}

function nextSlide() {
  if (!playlist.length || advancing) {
    return;
  }

  advancing = true;

  if (slideTimer) {
    clearTimeout(slideTimer);
    slideTimer = null;
  }

  current = (current + 1) % playlist.length;

  setTimeout(() => {
    advancing = false;
    showSlide();
  }, 100);
}

function showSlide() {
  if (!playlist.length) {
    return;
  }

  if (slideTimer) {
    clearTimeout(slideTimer);
    slideTimer = null;
  }

  const item = playlist[current];
  const screen = document.getElementById("screen");

  console.log("Showing item:", item);

  screen.innerHTML = "";

  if (item.type === "image") {

    const img = document.createElement("img");

    img.className = "ad-image";
    img.src = item.url + "?t=" + Date.now();

    img.addEventListener("error", () => {
      console.error("Image failed:", item.url);
      slideTimer = setTimeout(nextSlide, 1500);
    });

    screen.appendChild(img);

    const duration = item.duration || 10000;

    slideTimer = setTimeout(nextSlide, duration);
  }

  else if (item.type === "video") {

    const video = document.createElement("video");

    video.className = "ad-video";
    video.src = item.url + "?t=" + Date.now();

    video.autoplay = true;
    video.muted = true;
    video.playsInline = true;
    video.preload = "auto";

    video.addEventListener("ended", () => {
      nextSlide();
    });

    video.addEventListener("error", () => {
      console.error("Video failed:", item.url);
      slideTimer = setTimeout(nextSlide, 1500);
    });

    screen.appendChild(video);

    const playPromise = video.play();

    if (playPromise !== undefined) {
      playPromise.catch(error => {
        console.error("Video autoplay failed:", error);
        slideTimer = setTimeout(nextSlide, 1500);
      });
    }

    if (item.duration) {
      slideTimer = setTimeout(() => {
        video.pause();
        nextSlide();
      }, item.duration);
    }
  }

  else if (item.type === "text") {

    screen.innerHTML =
      "<div>" +
      "<div class='title'>" + (item.title || "") + "</div>" +
      "<div class='subtitle'>" + (item.subtitle || "") + "</div>" +
      "</div>";

    const duration = item.duration || 8000;

    slideTimer = setTimeout(nextSlide, duration);
  }

  else {
    console.error("Unknown playlist item type:", item);
    slideTimer = setTimeout(nextSlide, 1500);
  }
}

async function start() {
  await loadPlaylist();

  showSlide();

  setInterval(async () => {
    await loadPlaylist();
  }, 60000);
}

start();

</script>
