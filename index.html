<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#111;
  color:white;
  font-family:Arial,sans-serif;
}

#screen{
  width:100vw;
  height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  background:#111;
}

.title{
  font-size:64px;
}

.subtitle{
  font-size:30px;
  margin-top:25px;
}

img{
  width:100%;
  height:100%;
  object-fit:contain;
  background:#000;
}
</style>
</head>

<body>

<div id="screen"></div>

<script>
let playlist = [];
let current = 0;

async function loadPlaylist() {
  try {
    const response = await fetch("playlist.json?t=" + Date.now());
    playlist = await response.json();
  } catch(err) {
    document.getElementById("screen").innerHTML =
      "<div><div class='title'>PLAYLIST ERROR</div><div class='subtitle'>" +
      err +
      "</div></div>";
  }
}

function showSlide() {
  if (!playlist.length) return;

  const item = playlist[current];
  const screen = document.getElementById("screen");

  if (item.type === "text") {
    screen.innerHTML =
      "<div><div class='title'>" +
      item.title +
      "</div><div class='subtitle'>" +
      (item.subtitle || "") +
      "</div></div>";
  }

  if (item.type === "image") {
    screen.innerHTML =
      "<img src='" + item.url + "'>";
  }

  current = (current + 1) % playlist.length;

  setTimeout(showSlide, item.duration || 8000);
}

async function start() {
  await loadPlaylist();
  showSlide();

  setInterval(loadPlaylist, 60000);
}

start();
</script>

</body>
</html>
